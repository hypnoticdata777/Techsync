services:
  db:
    image: postgres:16-alpine
    container_name: techsync-local-postgres
    environment:
      POSTGRES_DB: techsync_local
      POSTGRES_USER: techsync
      POSTGRES_PASSWORD: techsync_local_only
    ports:
      - "55432:5432"
    volumes:
      - techsync-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techsync -d techsync_local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  techsync-local-postgres:
