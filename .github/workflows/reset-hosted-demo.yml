name: Reset hosted demo data

on:
  workflow_dispatch:
    inputs:
      strict_status:
        description: "Fail if the seeded demo status is not capture-ready"
        required: true
        type: boolean
        default: true

jobs:
  reset-demo:
    name: Migrate and reset hosted demo tenant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      APP_ENV: development
      DATABASE_URL: ${{ secrets.TECHSYNC_NEON_DIRECT_URL }}
      JWT_SECRET_KEY: ${{ secrets.TECHSYNC_HOSTED_DEMO_JWT_SECRET }}
      TECHSYNC_DEMO_PASSWORD: ${{ secrets.TECHSYNC_DEMO_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Reset synthetic hosted demo data
        run: python ../scripts/seed_demo_data.py seed --reset-existing

      - name: Check synthetic demo status
        run: |
          if [ "${{ inputs.strict_status }}" = "true" ]; then
            python ../scripts/seed_demo_data.py status --strict
          else
            python ../scripts/seed_demo_data.py status
          fi
